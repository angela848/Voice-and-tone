<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Voice Interview</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("JYIxTjBvwou3AHFET");
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap');

        /* Design System: CSS Variables */
        :root {
            --chartreuse-primary: #D6FF84;
            --chartreuse-dark: #c5ee6a;
            --teal-primary: #033D35;
            --teal-light: #0d5a52;
            --cream-bg: #FAF5EF;
            --purple-accent: #EAD3FF;
            --black-text: #1a1a1a;
            --gray-light: #f3f1ed;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream-bg);
            color: var(--black-text);
            line-height: 1.6;
        }

        /* Typography System */
        .headline-display {
            font-family: 'Archivo Black', sans-serif;
            font-weight: 900;
            font-size: 3.5rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .headline-xl {
            font-family: 'Archivo Black', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .headline-lg {
            font-family: 'Archivo Black', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.01em;
        }

        .headline-md {
            font-family: 'Archivo Black', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .text-bold {
            font-weight: 600;
        }

        .text-italic {
            font-style: italic;
            font-weight: 500;
        }

        /* Layout: Asymmetric Grid */
        .interview-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-card {
            animation: fadeInUp 0.5s ease-out;
            position: relative;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Asymmetric Section Headers */
        .section-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-header__title {
            grid-column: 1;
            background-color: var(--teal-primary);
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .section-header__title h1 {
            color: var(--chartreuse-primary);
            margin: 0;
            line-height: 1.1;
        }

        .section-header__accent {
            grid-column: 2;
            background-color: var(--chartreuse-primary);
            padding: 2rem;
            position: relative;
            transform: translateY(20px);
        }

        .section-header__accent p {
            color: var(--teal-primary);
            font-weight: 600;
            margin: 0;
        }

        /* Chat-like Interview Area */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chat-message {
            animation: slideIn 0.4s ease-out;
            max-width: 90%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .chat-message--question {
            margin-right: auto;
            padding: 1.25rem 1.5rem;
            background-color: var(--teal-primary);
            color: var(--cream-bg);
            border-radius: 0 12px 12px 12px;
            font-weight: 500;
            line-height: 1.5;
        }

        .chat-message--answer {
            margin-left: auto;
            padding: 1.25rem 1.5rem;
            background-color: var(--chartreuse-primary);
            color: var(--teal-primary);
            border-radius: 12px 0 12px 12px;
            font-weight: 500;
            line-height: 1.5;
            border-left: 4px solid var(--teal-primary);
        }

        .chat-message--skipped {
            margin-left: auto;
            padding: 1.25rem 1.5rem;
            background-color: var(--gray-light);
            color: var(--black-text);
            border-radius: 12px 0 12px 12px;
            font-style: italic;
            opacity: 0.7;
        }

        /* Input Area */
        .input-frame {
            background-color: var(--chartreuse-primary);
            border: 3px solid var(--teal-primary);
            padding: 2rem;
            border-radius: 8px;
            margin-top: 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .input-frame label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--teal-primary);
            font-size: 0.95rem;
        }

        .input-frame input,
        .input-frame textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--teal-primary);
            background-color: white;
            color: var(--black-text);
            font-family: 'Poppins', sans-serif;
            border-radius: 6px;
            font-size: 1rem;
            transition: var(--transition);
            resize: vertical;
        }

        .input-frame input:focus,
        .input-frame textarea:focus {
            outline: none;
            border-color: var(--teal-primary);
            background-color: #fafaf8;
            box-shadow: 0 0 0 3px rgba(3, 61, 53, 0.1);
        }

        .input-frame textarea {
            min-height: 120px;
        }

        /* Progress Bar */
        .progress-wrapper {
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 4px;
            background-color: var(--gray-light);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--chartreuse-primary);
            transition: width 0.5s ease;
            border-right: 3px solid var(--teal-primary);
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--black-text);
            margin-top: 0.5rem;
            text-align: right;
            font-weight: 500;
        }

        /* Buttons */
        .button-primary {
            background-color: var(--chartreuse-primary);
            color: var(--teal-primary);
            border: none;
            padding: 1rem 1.75rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .button-primary:hover {
            background-color: var(--chartreuse-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(214, 255, 132, 0.3);
        }

        .button-secondary {
            background-color: transparent;
            color: var(--teal-primary);
            border: 2px solid var(--teal-primary);
            padding: 1rem 1.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .button-secondary:hover {
            background-color: var(--teal-primary);
            color: var(--cream-bg);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        /* Summary Page */
        .summary-container {
            animation: fadeInUp 0.6s ease-out;
        }

        .summary-card {
            background-color: white;
            border-left: 4px solid var(--chartreuse-primary);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .summary-card h3 {
            color: var(--teal-primary);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .summary-card h2 {
            color: var(--teal-primary);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .summary-item {
            background-color: var(--purple-accent);
            padding: 1rem;
            border-radius: 6px;
        }

        .summary-item label {
            font-weight: 600;
            color: var(--teal-primary);
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        /* Slider Styles */
        .slider-container {
            margin-bottom: 2rem;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--teal-primary);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, var(--teal-primary) 0%, var(--chartreuse-primary) 100%);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--teal-primary);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid var(--chartreuse-primary);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--chartreuse-primary);
            transform: scale(1.15);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--teal-primary);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid var(--chartreuse-primary);
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: var(--chartreuse-primary);
            transform: scale(1.15);
        }

        /* Audio Recording UI */
        .audio-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .audio-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
        }

        .audio-button--record {
            background-color: #ff6b6b;
            color: white;
        }

        .audio-button--record:hover {
            background-color: #ff5252;
            transform: translateY(-2px);
        }

        .audio-button--stop {
            background-color: #ffa500;
            color: white;
        }

        .audio-button--stop:hover {
            background-color: #ff8c00;
        }

        .audio-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--teal-primary);
            font-weight: 500;
        }

        .audio-indicator--recording {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .audio-prompt-box {
            background-color: var(--purple-accent);
            border-left: 4px solid var(--chartreuse-primary);
            padding: 1.5rem;
            border-radius: 6px;
            margin-bottom: 2rem;
        }

        .audio-prompt-box h3 {
            color: var(--teal-primary);
            margin: 0 0 0.75rem 0;
            font-weight: 700;
        }

        .audio-prompt-box p {
            color: var(--black-text);
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Branding Header */
        .header {
            background-color: var(--teal-primary);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 2rem;
        }

        .header-logo {
            max-width: 200px;
            height: auto;
            min-width: 150px;
        }

        .header-logo svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .header-text {
            color: var(--chartreuse-primary);
            font-family: 'Archivo Black', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Celebration Screen */
        .celebration-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--cream-bg) 0%, var(--purple-accent) 100%);
        }

        .celebration-content {
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }

        .celebration-emoji {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .celebration-title {
            color: var(--teal-primary);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .celebration-subtitle {
            color: var(--black-text);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .celebration-highlight {
            background-color: var(--chartreuse-primary);
            color: var(--teal-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-weight: 700;
            display: inline-block;
            margin: 0 0.25rem;
        }

        .celebration-footer {
            color: var(--teal-primary);
            font-size: 0.95rem;
            margin-top: 2rem;
            font-weight: 500;
        }

        .celebration-logo {
            max-width: 140px;
            margin-top: 3rem;
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-header {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .section-header__title {
                grid-column: 1;
            }

            .section-header__accent {
                grid-column: 1;
                transform: none;
            }

            .chat-message {
                max-width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .headline-display {
                font-size: 2.5rem;
            }

            .headline-xl {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom hook for Web Speech API
        const useSpeechRecognition = (setCurrentAnswer) => {
            const [isRecording, setIsRecording] = useState(false);
            const recognitionRef = useRef(null);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = true;
                    recognitionRef.current.interimResults = true;
                    recognitionRef.current.lang = 'en-US';

                    recognitionRef.current.onresult = (event) => {
                        let interimTranscript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            const transcript = event.results[i][0].transcript;
                            if (event.results[i].isFinal) {
                                setCurrentAnswer(prev => prev + transcript + ' ');
                            } else {
                                interimTranscript += transcript;
                            }
                        }
                    };

                    recognitionRef.current.onerror = (event) => {
                        console.error('Speech recognition error', event.error);
                        setIsRecording(false);
                    };

                    recognitionRef.current.onend = () => {
                        setIsRecording(false);
                    };
                }
            }, [setCurrentAnswer]);

            const startRecording = () => {
                if (recognitionRef.current && !isRecording) {
                    setCurrentAnswer('');
                    setIsRecording(true);
                    recognitionRef.current.start();
                }
            };

            const stopRecording = () => {
                if (recognitionRef.current && isRecording) {
                    recognitionRef.current.stop();
                    setIsRecording(false);
                }
            };

            return { isRecording, startRecording, stopRecording };
        };

        // Interview sections configuration
        const INTERVIEW_SECTIONS = {
            intro: {
                questions: [
                    { id: 'welcome', type: 'confirm', text: "We're going to walk through your brand voice together — some open-ended questions about personality and tone, then a quick round of rapid-fire sliders at the end. Should take about 15 minutes. Ready?" },
                    { id: 'brandName', type: 'input', text: "First things first - what's the brand name we're working on?", key: 'brandName' },
                    { id: 'clientName', type: 'input', text: "And is this for a client, or your own brand? (You can skip this if it's your own)", key: 'clientName', optional: true },
                    { id: 'userName', type: 'input', text: "What's your name?", key: 'userName' },
                    { id: 'userEmail', type: 'input', text: "And your email?", key: 'userEmail' }
                ]
            },
            materials: {
                questions: [
                    { id: 'materialsIntro', type: 'confirm', text: "Before we dive in, do you have any existing materials we should look at? Brand guidelines, website copy, social posts — anything that shows how the brand currently sounds." },
                    { id: 'filesUrl', type: 'input', text: "If you have files for reference (past writing, brand guides, etc), please provide the URL to your Google Drive or Dropbox folder here:", key: 'filesUrl', optional: true },
                    { id: 'links', type: 'links', text: "Drop any links here (website, social profiles, past campaigns):", key: 'links', optional: true },
                    { id: 'copyExamples', type: 'textarea', text: "And if you want to paste any existing copy examples (headlines, about pages, social captions), throw them here:", key: 'copyExamples', optional: true }
                ]
            },
            audioPrompt: {
                questions: [
                    { id: 'audioIntro', type: 'confirm', text: "Next section, you can speak your answers or type — your choice for each question. Speaking can help you think out loud more naturally. Cool?" }
                ]
            },
            hook: {
                questions: [
                    { id: 'h1', type: 'textarea', text: "If someone asks what this brand is about at a party and you've got 15 seconds before they're pulled away — what do you say?", key: 'partyPitch', audioEnabled: true },
                    { id: 'h2', type: 'textarea', text: "If your brand walked into a room, who are they? Give me a 'This, Not That' pairing. Example: Are we Tracee Ellis Ross (polished, effortless) or Aubrey Plaza (dry, detached)?", key: 'thisNotThat', audioEnabled: true },
                    { id: 'h3', type: 'textarea', text: "If your brand was a neighborhood, which one would it be and why? (e.g., The polished Upper East Side vs. the gritty, creative Brooklyn)", key: 'neighborhood', audioEnabled: true }
                ]
            },
            guardrails: {
                questions: [
                    { id: 'g1', type: 'textarea', text: "Who is a brand or public figure everyone in your industry loves, but you secretly find annoying or performative?", key: 'antiRoleModel', audioEnabled: true },
                    { id: 'g2', type: 'textarea', text: "What are the three most common phrases in your industry that make you feel like you're reading a generic template?", key: 'buzzwordBan', audioEnabled: true },
                    { id: 'g3', type: 'textarea', text: "When someone finishes reading your content, what is the actual thought in their head? (e.g., 'That makes sense' vs. 'I need to buy this.')", key: 'soWhatTest', audioEnabled: true },
                    { id: 'g4', type: 'textarea', text: "What makes you close the tab? Be specific about the tone or posturing that feels unearned.", key: 'cringeList', audioEnabled: true }
                ]
            },
            mechanics: {
                questions: [
                    { id: 'm1', type: 'textarea', text: "Are we the 'Expert on the Stage' (lecturing) or the 'Smart Peer at the Bar' (sharing)?", key: 'expertDynamic', audioEnabled: true },
                    { id: 'm2', type: 'textarea', text: "Do we want short, punchy observations, or do we need space to build a complex argument?", key: 'pacing', audioEnabled: true },
                    { id: 'm3', type: 'textarea', text: "If I banned you from using exclamation points for a month, how would you signal to a client that you're excited about a project?", key: 'exclamationChallenge', audioEnabled: true },
                    { id: 'm4', type: 'textarea', text: "Real talk: are we a 'shit happens' brand, a 'darn it' brand, or something in between?", key: 'swearing', audioEnabled: true },
                    { id: 'm5', type: 'textarea', text: "Which phrases do you use constantly — and which 'industry standard' words should we set on fire?", key: 'vocabularyDrawer', audioEnabled: true }
                ]
            },
            cultural: {
                questions: [
                    { id: 'c1', type: 'textarea', text: "Give us 3 brands whose voice you'd steal if you could. What are they doing that works?", key: 'tonalStealing', audioEnabled: false },
                    { id: 'c2', type: 'textarea', text: "Which publications or creators does your ideal customer already follow? We're looking for tonal alignment, not subject matter.", key: 'culturalFilter', audioEnabled: false },
                    { id: 'c3', type: 'textarea', text: "Do we want to be 'early, but not first,' or do we prefer the 'timeless and familiar'?", key: 'timing', audioEnabled: true }
                ]
            },
            sliders: {
                questions: [
                    { id: 'slidersIntro', type: 'confirm', text: "Almost done. Last section is rapid-fire — we're going to throw personality sliders at you. Don't overthink it. Your gut reaction is usually the right one, and you can always land somewhere in the middle if neither extreme feels right." },
                    { id: 'sliders', type: 'sliders', sliders: [
                        { id: 'formality', left: 'Formal', right: 'Casual' },
                        { id: 'polish', left: 'Polished', right: 'Raw' },
                        { id: 'tone', left: 'Playful', right: 'Serious' },
                        { id: 'outlook', left: 'Optimistic', right: 'Realistic' },
                        { id: 'boldness', left: 'Safe', right: 'Bold' },
                        { id: 'edge', left: 'Conservative', right: 'Edgy' },
                        { id: 'style', left: 'Corporate', right: 'Conversational' },
                        { id: 'expression', left: 'Minimalist', right: 'Expressive' },
                        { id: 'timeliness', left: 'Timeless', right: 'Trend-driven' },
                        { id: 'delivery', left: 'Straightforward', right: 'Witty' },
                        { id: 'directness', left: 'Direct', right: 'Diplomatic' },
                        { id: 'punctuation', left: 'Rare !', right: 'Lots of !' }
                    ]}
                ]
            },
            wrapup: {
                questions: [
                    { id: 'finalComments', type: 'textarea', text: "Last call — anything you want to clarify, add, or change about your previous answers? This is your chance to refine or expand on anything.", key: 'finalComments', optional: true }
                ]
            }
        };

        function BrandVoiceInterview() {
            const [currentSection, setCurrentSection] = useState('landing');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [currentAnswer, setCurrentAnswer] = useState('');
            const [conversationHistory, setConversationHistory] = useState([]);
            const [interviewComplete, setInterviewComplete] = useState(false);
            const chatEndRef = useRef(null);

            const { isRecording, startRecording, stopRecording } = useSpeechRecognition(setCurrentAnswer);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [conversationHistory, currentQuestionIndex]);

            const getCurrentQuestion = () => {
                const section = INTERVIEW_SECTIONS[currentSection];
                if (!section) return null;

                    </div>
                    <div className="interview-container">
                    <div className="progress-wrapper">
                        <div className="progress-bar">
                            <div className="progress-fill" style={{ width: `${getProgressPercentage()}%` }} />
                        </div>
                        <div className="progress-text">{getProgressPercentage()}% complete</div>
                    </div>

                    <div className="section-card">
                        <div className="chat-container">
                            {conversationHistory.map((msg, idx) => (
                                <div key={idx} className={`chat-message ${msg.type === 'question' ? 'chat-message--question' : msg.content === '[Skipped]' ? 'chat-message--skipped' : 'chat-message--answer'}`}>
                                    {msg.content}
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                        </div>

                        {renderQuestion()}
                    </div>
                    </div>
                </div>
            );
        }

        function SliderComponent({ sliders, onComplete }) {
            const [values, setValues] = useState(
                sliders.reduce((acc, slider) => ({ ...acc, [slider.id]: 2 }), {})
            );

            const handleChange = (sliderId, value) => {
                setValues(prev => ({ ...prev, [sliderId]: value }));
            };

            return (
                <div>
                    <div style={{ marginBottom: '2rem' }}>
                        {sliders.map(slider => (
                            <div key={slider.id} className="slider-container">
                                <label className="text-bold">{slider.id}</label>
                                <div className="slider-labels">
                                    <span>{slider.left}</span>
                                    <span>{slider.right}</span>
                                </div>
                                <input
                                    type="range"
                                    min="0"
                                    max="4"
                                    value={values[slider.id]}
                                    onChange={(e) => handleChange(slider.id, parseInt(e.target.value))}
                                    style={{ width: '100%' }}
                                />
                            </div>
                        ))}
                    </div>

                    <button onClick={() => onComplete(values)} className="button-primary w-full" style={{ padding: '1rem', fontSize: '1.1rem' }}>
                        Next Section
                    </button>
                </div>
            );
        }

        ReactDOM.render(<BrandVoiceInterview />, document.getElementById('root'));
    </script>
